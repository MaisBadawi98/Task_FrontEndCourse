<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search for a rental car</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
     background-image: url('./image/orange-background.jpg');      
     background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class=" d-flex align-items-center justify-content-center p-3" >

  <div class="bg-white rounded-4 shadow-lg p-4 p-sm-5 w-100" style="max-width: 440px;">
    
    <h2 class="fw-bold fs-4 mb-4" style="color:blue">Search for a rental car</h2>
    
    <form>
    
      <div class="mb-3">
        <label class="form-label fw-semibold small text-dark mb-1">Pick up location</label>
        <input type="text" class="form-control form-control-lg fs-6 rounded-3" placeholder="City, airport, region, district...">
      </div>

    
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="deliverElse">
        <label class="form-check-label small text-secondary fw-medium" for="deliverElse">
          Deliver the car somewhere else
        </label>
      </div>

    
      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="form-label fw-semibold small text-dark mb-1">Date of pickup</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-primary-emphasis">
              <i class="bi bi-calendar3"></i>
            </span>
            <input type="text" class="form-control border-start-0 ps-0 fs-6 rounded-end-3" value="Sat 26 Mar 2022">
          </div>
        </div>
        <div class="col-6">
          <label class="form-label fw-semibold small text-dark mb-1">Date of delivery</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-primary-emphasis">
              <i class="bi bi-calendar3"></i>
            </span>
            <input type="text" class="form-control border-start-0 ps-0 fs-6 rounded-end-3" value="Tue 29 Mar 2022">
          </div>
        </div>
      </div>

     
      <div class="row g-2 mb-3">
        <div class="col-3">
          <select class="form-select rounded-3">
            <option selected>10</option>
          </select>
        </div>
        <div class="col-3">
          <select class="form-select rounded-3">
            <option selected>00</option>
          </select>
        </div>
        <div class="col-3">
          <select class="form-select rounded-3">
            <option selected>10</option>
          </select>
        </div>
        <div class="col-3">
          <select class="form-select rounded-3">
            <option selected>00</option>
          </select>
        </div>
      </div>

     
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="ageCheck" checked>
        <label class="form-check-label small text-dark fw-medium" for="ageCheck">
          The driver's age between 30 and 65? <i class="bi bi-info-circle text-muted ms-1"></i>
        </label>
      </div>

      
      <ul class="list-unstyled small fw-medium text-dark mb-4">
        <li class="mb-1 d-flex align-items-center">
          <i class="bi bi-check2 me-2 fw-bold"></i> No credit card fees
        </li>
        <li class="mb-1 d-flex align-items-center">
          <i class="bi bi-check2 me-2 fw-bold"></i> No change fees
        </li>
        <li class="d-flex align-items-center">
          <i class="bi bi-check2 me-2 fw-bold"></i> Price match guarantee
        </li>
      </ul>

      
      <button type="submit" class="btn btn-danger w-100 rounded-pill py-2.5 fw-bold fs-6">
        Search
      </button>
    </form>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
